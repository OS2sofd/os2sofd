<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header}"></head>
<body>
	<div class="wrapper">
		<header th:replace="~{fragments/navbar :: navbar-header (subpage = 'report')}"></header>
		<aside th:replace="~{fragments/navbar :: navbar-aside (page = 'accountcreation', subpage = 'report')}"></aside>

		<section>
			<div class="content-wrapper">
				<h3 th:text="#{html.page.accountorders.header}"></h3>
				<div class="panel panel-default">
					<div class="panel-heading"></div>
					<div class="panel-body">
						<div class="table-responsive">
							<table id="listTable" class="table table-striped table-hover listTable">
								<thead>
									<tr>
										<th class="col-md-2" th:text="#{html.page.accountorders.activationTime}"></th>
										<th class="col-md-3" th:text="#{html.page.accountorders.personName}"></th>
										<th class="col-md-2" th:text="#{html.page.accountorders.triggerAffiliation}"></th>
										<th class="col-md-1" th:text="#{html.page.accountorders.userId}"></th>
										<th class="col-md-1" th:text="#{html.page.accountorders.orderType}"></th>
										<th class="col-md-1" th:text="#{html.page.accountorders.userType}"></th>
										<th class="col-md-1" th:text="#{html.page.accountorders.status}"></th>
										<th class="col-md-1" th:text="#{html.control.operations}"></th>
									</tr>
								</thead>

								<tfoot style="display: table-row-group">
									<tr>
										<td class="select-filter">
											<select id="windowFilter" class="form-control input-sm" style="width: 100%;">
												<option value="" th:text="#{html.page.accountorders.filter.showall}"></option>
												<option value="P1W" th:text="#{html.page.accountorders.window.week1}"></option>
												<option value="P2W" th:text="#{html.page.accountorders.window.week2}"></option>
												<option value="P1M" th:text="#{html.page.accountorders.window.month1}"></option>
												<option value="P3M" th:text="#{html.page.accountorders.window.month3}"></option>
												<option value="P1Y" th:text="#{html.page.accountorders.window.year1}"></option>
											</select>
										</td>
										<td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" th:placeholder="#{html.datatables.search}" /></td>
										<td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" th:placeholder="#{html.datatables.search}" /></td>
										<td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" th:placeholder="#{html.datatables.search}" /></td>
										<td class="select-filter">
											<select id="orderTypeFilter" class="form-control input-sm" style="width: 100%;">
												<option value="" th:text="#{html.page.accountorders.filter.showall}"></option>
												<option th:each="entry : ${orderTypes}" th:value="${entry.key}" th:text="${entry.value}"></option>
											</select>
										</td>
										<td class="select-filter">
											<select id="userTypeFilter" class="form-control input-sm" style="width: 100%;">
												<option value="" th:text="#{html.page.accountorders.filter.showall}"></option>
												<option th:each="entry : ${userTypes}" th:value="${entry.key}" th:text="${entry.value}"></option>
											</select>
										</td>
										<td class="select-filter">
											<select id="statusFilter" class="form-control input-sm" style="width: 100%;">
												<option value="" th:text="#{html.page.accountorders.filter.showall}"></option>
												<option th:each="entry : ${statuses}" th:value="${entry.key}" th:text="${entry.value}"></option>
											</select>
										</td>
										<td>&nbsp;</td>
									</tr>
								</tfoot>

								<tbody>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</section>
	</div>

	<nav th:replace="~{fragments/footer :: footer}"></nav>

	<script th:inline="javascript">
		/*<![CDATA[*/

		/*[+
			var searchTxt = [[#{html.datatables.search}]];
			var dropdownTxt = [[#{html.datatables.dropdown}]];
			var infoDefaultTxt = [[#{html.datatables.info.default}]];
			var infoEmptyTxt = [[#{html.datatables.info.empty}]];
			var infoFilteredTxt = [[#{html.datatables.info.filtered}]];
			var prevTxt = [[#{html.datatables.prev}]];
			var nextTxt = [[#{html.datatables.next}]];

			var ajaxUrl = [[@{/rest/accountorder/list}]];
			var deleteURL = [[@{/rest/accountorder/delete}]];
			var personUrl = [[@{/ui/person/view/}]];
			var orderUrl = [[@{/ui/report/accountorders/}]];

			var removeTitle = [[#{html.page.accountorders.delete.title}]];
			var removeText = [[#{html.page.accountorders.delete.text}]];
			var removeButtonConfirm = [[#{html.button.delete}]];
			var removeButtonCancel = [[#{html.button.cancel}]];
			var deleteErrorMsg = [[#{html.page.accountorders.delete.error}]];
		+]*/

		var token = $("meta[name='_csrf']").attr("content");
		var currentTable;

		$(document).ready(function() {
			loadDataTable();
		});

		var escapeHtml = $.fn.dataTable.render.text().display;

		function loadDataTable() {
			currentTable = $('#listTable').DataTable({
				'destroy': true,
				'ajax': {
					'contentType': 'application/json',
					'url': ajaxUrl,
					'type': 'POST',
					'headers': {
						'X-CSRF-TOKEN': token
					},
					'data': function(d) {
						return JSON.stringify(d);
					}
				},
				'serverSide': true,
				'columns': [
					{
						data: 'activationTimestamp',
						render: $.fn.dataTable.render.text()
					},
					{
						data: 'personName',
						render: function (data, type, row, meta) {
							return '<a href="' + personUrl + row.personUuid + '?backRef=adaccount" style="color: inherit; text-decoration: none;">' +
								   escapeHtml(data) + '&nbsp;<em class="fa fa-external-link"></em></a>';
						}
					},
					{
						data: 'triggerAffiliation',
						render: $.fn.dataTable.render.text()
					},
					{
						data: 'userId',
						render: $.fn.dataTable.render.text()
					},
					{
						data: 'orderType',
						render: $.fn.dataTable.render.text()
					},
					{
						data: 'userType',
						render: $.fn.dataTable.render.text()
					},
					{
						data: 'status',
						render: $.fn.dataTable.render.text()
					},
					{
						data: 'id',
						orderable: false,
						searchable: false,
						render: function (data, type, row, meta) {
							return '<a href="' + orderUrl + data + '?backRef=accountorders"><em class="fa fa-fw fa-search"></em></a>' +
								   '<a href="#" data-orderid="' + data + '" onclick="deleteAccountOrder(this); return false;"><em class="fa fa-fw fa-times"></em></a>';
						}
					}
				],
				'paging':    true,
				'ordering':  true,
				'stateSave': true,
				'info':      true,
				'order':     [0, 'desc'],
				'pageLength': 25,
				// default the activation window to two weeks ahead, so the teardown orders scheduled months
				// out do not bury everything else. A saved state overrides this, so a chosen window sticks
				'searchCols': [ { 'search': 'P2W' }, null, null, null, null, null, null, null ],
				'language': {
					"search":	   searchTxt,
					"lengthMenu":   dropdownTxt,
					"info":		 infoDefaultTxt,
					"zeroRecords":  infoEmptyTxt,
					"infoEmpty":	"",
					"infoFiltered": infoFilteredTxt,
					"paginate": {
						"next": nextTxt,
						"previous": prevTxt
					}
				}
			});

			// show whatever search each column ended up with, whether that came from searchCols above or
			// from a saved state. No redraw, DataTables has already applied them to the first request
			currentTable.columns().every(function() {
				var search = this.search();

				if (search) {
					$('input, select', this.footer()).val(search);
				}
			});

			// apply the free-text filters, debounced so typing a name is one request once you stop rather
			// than one per keystroke. Not DataTables' own throttle helper, as that fires on the leading
			// edge too, and the single-character search is the most expensive one to run
			$.each($('.input-filter', currentTable.table().footer()), function() {
				var column = currentTable.column($(this).index());
				var timer;

				$('input', this).on('keyup change', function () {
					var value = this.value;

					clearTimeout(timer);
					timer = setTimeout(function() {
						if (column.search() !== value) {
							column.search(value).draw();
						}
					}, 400);
				});
			});

			// apply the dropdown filters
			$.each($('.select-filter', currentTable.table().footer()), function() {
				var column = currentTable.column($(this).index());

				$('select', this).on('change', function () {
					if (column.search() !== this.value) {
						column.search(this.value).draw();
					}
				});
			});
		}

		function deleteAccountOrder(elem) {
			var orderId = $(elem).data('orderid');

			swal({
				html : true,
				title : removeTitle,
				text : removeText,
				type : "warning",
				showCancelButton : true,
				confirmButtonColor : "#DD6B55",
				confirmButtonText : removeButtonConfirm,
				cancelButtonText : removeButtonCancel,
				closeOnConfirm : true,
				closeOnCancel : true
			},
			function(isConfirm) {
				if (isConfirm) {
					$.ajax({
						url: deleteURL,
						headers: {
							'X-CSRF-TOKEN': token
						},
						type: 'post',
						contentType: 'application/json',
						data: JSON.stringify({ orderId: orderId }),
						success: function( data, textStatus, jQxhr ){
							currentTable.ajax.reload(null, false);
						},
						error: function( jqXhr, textStatus, errorThrown ){
							$.notify({
								message: deleteErrorMsg
							}, {
								status: 'danger',
								autoHideDelay: 4000
							});
						}
					});
				}
			});
		}

		/*]]>*/
	</script>
</body>
</html>
